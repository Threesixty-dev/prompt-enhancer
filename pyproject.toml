[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-enhancer"
version = "0.1.0"
description = "Local-first, privacy-sensitive analytics for coding-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1,<1",
  "pydantic>=2.11.7,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=8.4.1,<9",
]
models = [
  "huggingface-hub>=0.35,<1",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.8,<3",
  "transformers>=4.56,<5",
  "accelerate>=1,<2",
  "bitsandbytes>=0.45,<1",
]
desktop = [
  "pywebview>=6,<7",
]

[project.scripts]
prompt-enhancer = "prompt_enhancer.cli:main"

[project.gui-scripts]
prompt-enhancer-desktop = "prompt_enhancer.desktop_overlay:desktop_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_enhancer = [
  "_resources/probes/*.py",
  "_resources/public/*.json",
  "_resources/public/*.txt",
  "_resources/dashboard/*",
  "_resources/dashboard/assets/*",
  "_resources/dashboard/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
