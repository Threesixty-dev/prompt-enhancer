[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enhancement-bench"
version = "0.1.0"
description = "Private experiment bench for the versioned Prompt Enhancer API"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "httpx==0.28.1", "jsonschema==4.26.0", "uvicorn==0.35.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "PyYAML==6.0.3"]

[project.scripts]
enhancement-bench = "enhancement_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enhancement_bench = ["static/*", "*.sql", "*.json", "*.md"]
