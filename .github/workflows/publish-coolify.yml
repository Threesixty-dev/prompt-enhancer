name: Deploy to Coolify

# Deliberate production publishing, only from the reviewed primary branch.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COOLIFY_WEBHOOK: ${{ vars.COOLIFY_WEBHOOK }}
  COOLIFY_PUBLIC_URL: ${{ vars.COOLIFY_PUBLIC_URL }}
  DEPLOY_REPOSITORY: ${{ github.repository }}
  DEPLOY_BRANCH: ${{ github.ref_name }}
  DEPLOY_REVISION: ${{ github.sha }}

concurrency:
  group: coolify-production
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Require reviewed main
        env:
          BRANCH: ${{ github.ref }}
        run: test "$BRANCH" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check required configuration before building
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_ACCESS_CLIENT_ID }}
          COOLIFY_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_ACCESS_CLIENT_SECRET }}
          PROMPT_ENHANCER_ACCESS_CLIENT_ID: ${{ secrets.PROMPT_ENHANCER_ACCESS_CLIENT_ID }}
          PROMPT_ENHANCER_ACCESS_CLIENT_SECRET: ${{ secrets.PROMPT_ENHANCER_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/deploy_coolify.py --check

  quality:
    name: Reuse validated main commit
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require successful quality checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/require_quality_run.py

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the candidate without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: prompt-enhancer:candidate
          build-args: APP_REVISION=${{ github.sha }}
      - name: Check the actual container boundary
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: python scripts/smoke_hosted_container.py

  deploy:
    needs: container
    # Set to a JSON array of private runner labels if the controller is LAN-only.
    runs-on: ${{ fromJSON(vars.COOLIFY_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pin, deploy and verify the tested source revision
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_ACCESS_CLIENT_ID }}
          COOLIFY_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_ACCESS_CLIENT_SECRET }}
          PROMPT_ENHANCER_ACCESS_CLIENT_ID: ${{ secrets.PROMPT_ENHANCER_ACCESS_CLIENT_ID }}
          PROMPT_ENHANCER_ACCESS_CLIENT_SECRET: ${{ secrets.PROMPT_ENHANCER_ACCESS_CLIENT_SECRET }}
        run: python scripts/deploy_coolify.py
