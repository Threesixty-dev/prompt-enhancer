name: Publish Experiments
on:
  push:
    paths: ["experiments/**/*.json"]
  workflow_dispatch:
    inputs:
      image_repository:
        description: Reviewed image repository without a tag
        required: false
        type: string
      core_variant:
        description: Reviewed core dependency variant; models includes offline typed model runtimes
        required: true
        default: default
        type: choice
        options: [default, models]
permissions:
  contents: read
concurrency:
  group: bench-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.BENCH_PUBLICATION_BRANCH || github.event.repository.default_branch)
    environment: bench-publication
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.4"
      - name: Validate Experiments and privacy
        run: |
          uv sync --project bench --frozen --extra dev
          bench/.venv/bin/python -m enhancement_bench.cli validate experiments/*.json
          python scripts/privacy_scan.py
      - name: Authenticate to approved registry
        if: vars.BENCH_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.BENCH_REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      - name: Resolve existing core versions and immutable digests
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository || vars.BENCH_IMAGE_REPOSITORY }}
          CORE_VARIANT: ${{ inputs.core_variant || vars.BENCH_CORE_VARIANT || 'default' }}
          BENCH_CORE_IMAGES: ${{ vars.BENCH_CORE_IMAGES || '{}' }}
        run: bench/.venv/bin/python bench/ci.py --repository "$IMAGE_REPOSITORY" --variant "$CORE_VARIANT" --output "$RUNNER_TEMP/bench-publications"
      - name: Idempotently deliver validated envelopes
        env:
          BENCH_DELIVERY_URL: ${{ vars.BENCH_DELIVERY_URL }}
          BENCH_CF_ACCESS_CLIENT_ID: ${{ secrets.BENCH_CF_ACCESS_CLIENT_ID }}
          BENCH_CF_ACCESS_CLIENT_SECRET: ${{ secrets.BENCH_CF_ACCESS_CLIENT_SECRET }}
        run: |
          for publication in "$RUNNER_TEMP"/bench-publications/*.json; do
            bench/.venv/bin/python -m enhancement_bench.cli deliver "$publication"
          done
      - name: Remove job registry credentials
        if: always() && vars.BENCH_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.BENCH_REGISTRY }}
        run: docker logout "$REGISTRY"
