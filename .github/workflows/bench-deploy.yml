name: Deploy Bench to Coolify

on:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "contracts/enhancement/**"
      - "deployment/bench/Dockerfile*"
      - "scripts/deploy_bench.py"
      - "scripts/deploy_coolify.py"
      - "scripts/smoke_bench_image.py"
      - "tests/bench/**"
      - ".github/workflows/bench-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-coolify-production
  cancel-in-progress: false

env:
  DEPLOY_REVISION: ${{ github.sha }}
  DEPLOY_BRANCH: ${{ github.ref_name }}

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      BENCH_COOLIFY_URL: ${{ vars.BENCH_COOLIFY_URL }}
      BENCH_COOLIFY_SERVICE_UUID: ${{ vars.BENCH_COOLIFY_SERVICE_UUID }}
      BENCH_COOLIFY_API_UUID: ${{ vars.BENCH_COOLIFY_API_UUID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate the scoped Coolify target
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_ACCESS_CLIENT_ID }}
          COOLIFY_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/deploy_bench.py check-controller
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.4"
      - name: Focused Bench checks
        run: |
          uv sync --project bench --frozen --extra dev
          bench/.venv/bin/python -m pytest -q tests/bench
          python scripts/privacy_scan.py
          node --check bench/src/enhancement_bench/static/app.js
      - name: Build on Coolify and verify the running API revision
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_ACCESS_CLIENT_ID }}
          COOLIFY_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_ACCESS_CLIENT_SECRET }}
        run: python scripts/deploy_bench.py deploy
