name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Automatic runs keep fast integrity checks; full suites require manual dispatch.
# Superseded PR candidates can stop; each main commit keeps its own evidence.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-integrity:
    name: Repository integrity
    outputs:
      ci: ${{ steps.changes.outputs.ci }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed components
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          token: ''
          base: ${{ github.event.before || github.event.pull_request.base.sha || github.ref }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          predicate-quantifier: some-with-excludes
          filters: .github/validation-paths.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run privacy scan
        run: python scripts/privacy_scan.py

      - name: Check generated architecture catalog and diagrams
        run: python scripts/render_architecture_atlas.py --check

      - name: Check pull request patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Check pushed patch whitespace
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
            git show --check --format= "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA...$HEAD_SHA"
          fi

  backend:
    needs: repository-integrity
    if: github.event_name == 'workflow_dispatch'
    name: Backend (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify committed Python lock
        run: uv lock --check

      - name: Sync locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Compile Python sources and tests
        run: uv run --frozen --extra dev python -m compileall -q src tests scripts

      - name: Exercise Linux link boundaries without skips
        if: runner.os == 'Linux'
        shell: bash
        run: |
          report="$RUNNER_TEMP/linux-link-boundaries.xml"
          uv run --frozen --extra dev python -m pytest -q \
            tests/test_database_symlink.py \
            tests/test_local_model_provenance.py \
            tests/test_local_text_model_evaluation.py \
            tests/test_quarantined_local_file_reader.py \
            tests/test_scanner_symlink.py \
            tests/test_social_sqlite_boundary.py \
            tests/test_symlink_home.py \
            --junitxml="$report"
          uv run --frozen --extra dev python -c "import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); suites = [root] if root.tag == 'testsuite' else list(root); skipped = sum(int(suite.attrib.get('skipped', '0')) for suite in suites); assert skipped == 0, f'{skipped} platform-owned link tests skipped'" "$report"

      - name: Exercise Windows process and portability boundaries without skips
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "windows-owned-process-boundaries.xml"
          uv run --frozen --extra dev python -m pytest -q `
            "tests/test_chunked_model_ensemble.py::test_windows_tree_cleanup_requires_positive_owned_job_exit" `
            "tests/test_model_compatibility_catalog.py::test_windows_accelerator_cleanup_reaps_an_atomically_owned_descendant" `
            "tests/test_owned_process.py::test_windows_owned_process_has_no_visible_window_and_no_breakaway" `
            "tests/test_background_model_control.py::test_real_watch_controller_keeps_shutdown_cancelled_without_failure_streak" `
            "tests/test_scope_router.py::test_frozen_scope_router_corpus_is_large_balanced_and_language_independent" `
            "tests/test_scope_router.py::test_canonical_scope_router_fixture_requires_exact_digest" `
            "tests/test_windows_distribution_hardening.py::test_public_build_manifest_cli_compares_two_trees_without_host_paths" `
            --junitxml="$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --extra dev python -c "import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); suites = [root] if root.tag == 'testsuite' else list(root); skipped = sum(int(suite.attrib.get('skipped', '0')) for suite in suites); assert skipped == 0, f'{skipped} platform-owned Windows tests skipped'" "$report"

      - name: Run required backend shard
        run: uv run --frozen --extra dev python -m scripts.run_backend_shard --shard ${{ matrix.shard }} --shard-count 2

  frontend:
    needs: repository-integrity
    if: github.event_name == 'workflow_dispatch'
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend suite
        run: npm test

      - name: Check generated API client drift
        run: npm run check:api

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser suite
        run: npm run test:e2e

  ci-policy:
    name: CI policy
    needs: repository-integrity
    if: github.event_name == 'workflow_dispatch' || needs.repository-integrity.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.4"
      - name: Validate release evidence requirements
        run: uv run --frozen --extra dev python -m pytest -q tests/test_quality_reuse.py

  quality-result:
    name: Quality result
    if: always()
    needs: [repository-integrity, backend, frontend, ci-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected suite to pass
        env:
          INTEGRITY: ${{ needs.repository-integrity.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CI_POLICY: ${{ needs.ci-policy.result }}
          EXPECT_BACKEND: ${{ github.event_name == 'workflow_dispatch' && 'success' || 'skipped' }}
          EXPECT_FRONTEND: ${{ github.event_name == 'workflow_dispatch' && 'success' || 'skipped' }}
          EXPECT_CI_POLICY: ${{ (github.event_name == 'workflow_dispatch' || needs.repository-integrity.outputs.ci == 'true') && 'success' || 'skipped' }}
        run: |
          test "$INTEGRITY" = success
          test "$BACKEND" = "$EXPECT_BACKEND"
          test "$FRONTEND" = "$EXPECT_FRONTEND"
          test "$CI_POLICY" = "$EXPECT_CI_POLICY"
