# Product suites follow their source and dependency paths. CI edits run policy checks.
backend:
  - 'src/**'
  - 'tests/**'
  - '!tests/bench/**'
  - '!tests/test_quality_reuse.py'
  - 'scripts/**'
  - '!scripts/require_quality_run.py'
  - 'contracts/enhancement/**'
  - 'docs/openapi.json'
  - 'deploy/coolify/**'
  - 'pyproject.toml'
  - 'uv.lock'
frontend:
  - 'frontend/**'
  - 'docs/openapi.json'
  - 'scripts/export_openapi.py'
bench_definitions:
  - 'experiments/**'
bench:
  - 'bench/**'
  - '.github/workflows/bench-*.yml'
  - 'tests/bench/**'
  - 'tests/conftest.py'
  - 'tests/support/**'
  - 'deployment/bench/**'
  - 'contracts/enhancement/**'
  - 'containers/enhancement-core/**'
  - 'src/**'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'scripts/deploy_bench.py'
  - 'scripts/deploy_coolify.py'
  - 'scripts/smoke_bench_image.py'
hosted:
  - 'Dockerfile'
  - '.dockerignore'
  - 'src/**'
  - 'frontend/**'
  - 'deploy/coolify/**'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'scripts/smoke_hosted_container.py'
ci:
  - '.github/**'
  - 'scripts/require_quality_run.py'
  - 'tests/test_quality_reuse.py'
